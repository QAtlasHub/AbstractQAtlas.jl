name: CI
on: { push: { branches: [main] }, pull_request: {} }

# Two calls into TestShards, one per Julia version, in ONE run — which is why both carry an
# `artifact-prefix`. Without one they publish artifacts under the same names and the second call
# fails on an upload AFTER its tests passed, because upload-artifact rejects a duplicate name.
#
# `record-timings: false` on the LTS leg is the quieter half and matters more. Both legs would
# otherwise record to the same `ci-timings` branch having measured DIFFERENT configurations:
# whichever finished last would win, silently, and every later run would be planned against a
# history that is half one version and half the other. Nothing would fail; the balance would
# just stop meaning what it says.
#
# Called directly, and passing the secret, because this repository is public and in the same
# organisation as TestShards.
jobs:
  ci:
    permissions:
      contents: write   # the timing history is pushed to the `ci-timings` orphan branch
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      shards: 4
      artifact-prefix: v1
      registries: |
        General
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Exercise the declared `julia` floor, so the compat bound is tested rather than
  # asserted. That floor is 1.11 and is no longer the LTS: ExperimentalAPI requires
  # 1.11, and not incidentally, since its `surface` is `names(m)` under the meaning
  # 1.11 gave that function.
  #
  # The key stays `ci-lts` although it no longer tests the LTS, because branch
  # protection requires the context `ci-lts / All shards passed` by name and a
  # renamed job would simply never report it. Renaming needs the required context
  # swapped first.
  ci-lts:
    permissions:
      contents: write
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      shards: 4
      julia-version: '1.11'
      artifact-prefix: lts
      # The history belongs to the version above: two legs measuring different configurations
      # cannot both own it.
      record-timings: false
      registries: |
        General
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
